<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12" />
      <stop offset="50%" stop-color="#11131a" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: "SF Mono", "Fira Code", Menlo, Monaco, Consolas, monospace; }
    .title { font-weight: 700; font-size: 28px; letter-spacing: -0.5px; }
    .sub { font-size: 13px; fill: #a1a1aa; }
    .code { font-size: 13px; fill: #e4e4e7; }
    .prompt { fill: #10b981; font-weight: 600; }
    .comment { fill: #71717a; font-style: italic; }
    .cursor {
      animation: blink 1.1s infinite;
      fill: #10b981;
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="236" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5" />

  <!-- Window Header / Traffic Lights -->
  <line x1="2" y1="44" x2="848" y2="44" stroke="#1f212a" stroke-width="1" />
  <circle cx="28" cy="24" r="6" fill="#ff5f56" />
  <circle cx="48" cy="24" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="24" r="6" fill="#27c93f" />
  <text x="425" y="27" text-anchor="middle" class="mono" font-size="11" fill="#71717a">azat@macbook: ~</text>

  <!-- Title Section -->
  <g transform="translate(36, 82)">
    <text class="mono title" fill="url(#emeraldGrad)">Azat Madiyev</text>
    <text x="210" y="-3" class="mono" font-size="12" fill="#71717a">(@abbakkio)</text>
    <text x="0" y="24" class="mono sub">Mathematical &amp; Computational Science • Systems &amp; macOS Architecture</text>
  </g>

  <!-- Monospace Terminal Prompt Block -->
  <g transform="translate(36, 146)">
    <!-- Terminal Background Pill -->
    <rect x="0" y="0" width="778" height="66" rx="8" fill="#12141c" stroke="#222530" stroke-width="1" />

    <!-- Prompt line 1 -->
    <text x="18" y="27" class="mono code">
      <tspan class="prompt">➜</tspan> <tspan fill="#60a5fa">~</tspan> <tspan fill="#f43f5e">git</tspan> status
      <tspan fill="#a1a1aa"> -- </tspan>
      <tspan fill="#34d399">branch main</tspan>
      <tspan fill="#71717a"> [clean, building @ </tspan><tspan fill="#38bdf8">abbakkio.dev</tspan><tspan fill="#71717a">]</tspan>
    </text>

    <!-- Prompt line 2 -->
    <text x="18" y="49" class="mono code">
      <tspan class="prompt">➜</tspan> <tspan fill="#60a5fa">~</tspan> <tspan class="comment">// exploring mathematics, systems &amp; software craftsmanship</tspan>
      <tspan class="cursor">█</tspan>
    </text>
  </g>
</svg>
